<!DOCTYPE html>
<html>
<head>
    <title>Network</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3 py-2">
    <a class="navbar-brand" style="font-size:20px;" href="{% url 'index' %}">Network</a>
    <ul class="navbar-nav ml-auto flex-row">
        <li class="nav-item mx-2">
            <a class="nav-link p-0 text-white" href="{% url 'index' %}">All Posts</a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-item mx-2">
            <a class="nav-link p-0 text-white" href="{% url 'following' %}">Following</a>
        </li>
        <li class="nav-item mx-2">
            <a class="nav-link p-0 text-white" href="{% url 'logout' %}">Log Out</a>
        </li>
        {% else %}
        <li class="nav-item mx-2">
            <a class="nav-link p-0 text-white" href="{% url 'login' %}">Log In</a>
        </li>
        <li class="nav-item mx-2">
            <a class="nav-link p-0 text-white" href="{% url 'register' %}">Register</a>
        </li>
        {% endif %}
    </ul>
</nav>

<div class="container mt-4">
    {% block body %}
    {% endblock %}
</div>

</body>
</html>
